<!DOCTYPE html>
<html lang="{{ current_lang or 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('login_header') }} - {{ _('system_title') }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      position: relative;
    }
    .lang-toggle {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Language Toggle -->
    <div class="lang-toggle dropdown">
      <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1 shadow-sm" type="button" data-bs-toggle="dropdown">
        <i class="bi bi-translate text-primary"></i>
        <span>{% if current_lang == 'bn' %}বাংলা{% else %}English{% endif %}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><a class="dropdown-item {% if current_lang == 'en' %}active{% endif %}" href="/set-language?lang=en&next=/auth/login">🇬🇧 English</a></li>
        <li><a class="dropdown-item {% if current_lang == 'bn' %}active{% endif %}" href="/set-language?lang=bn&next=/auth/login">🇧🇩 বাংলা (Bangla)</a></li>
      </ul>
    </div>

    <div class="text-center mb-4 mt-2">
      <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
        <i class="bi bi-currency-exchange fs-1"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">{{ _('login_header') }}</h4>
      <p class="text-muted small">{{ _('login_subtext') }}</p>
    </div>

    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}

    <form action="/auth/login" method="POST">
      <div class="mb-3">
        <label class="form-label small fw-bold text-secondary">{{ _('username') }}</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="admin / staff" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-secondary">{{ _('password') }}</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
        <i class="bi bi-box-arrow-in-right me-2"></i>{{ _('sign_in_btn') }}
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <p class="text-muted small mb-1">{{ _('credentials_hint') }}</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
