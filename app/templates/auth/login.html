<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Foreign Currency Exchange System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
        <i class="bi bi-currency-exchange fs-1"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Money Exchange System</h4>
      <p class="text-muted small">Sign in to access your financial workstation</p>
    </div>

    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}

    <form action="/auth/login" method="POST">
      <div class="mb-3">
        <label class="form-label small fw-bold text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="admin or staff" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <p class="text-muted small mb-1">Default credentials for local environment:</p>
      <code class="small text-dark">admin / admin123</code> &bull; <code class="small text-dark">staff / staff123</code>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
